name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger trx --results-directory testresults --collect:"XPlat Code Coverage"

      - name: Test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: xUnit Results
          path: testresults/**/*.trx
          reporter: dotnet-trx

      - name: Coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"testresults/**/coverage.cobertura.xml" -targetdir:"coveragereport" -reporttypes:"MarkdownSummaryGithub;Cobertura" -verbosity:Warning

      - name: Write coverage to job summary
        if: always()
        run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Coverage PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request'
        with:
          recreate: true
          path: coveragereport/SummaryGithub.md

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coveragereport/Cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
